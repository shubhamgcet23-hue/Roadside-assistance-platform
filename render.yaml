# Render Blueprint for the API. The client is deployed separately on Vercel or Netlify (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: roadsideaaa-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
